name: Setup Foundry

on:
  push:
    paths:
      - ".github/foundry-ci.env"
      - ".github/workflows/setup-foundry.yaml"
      - "Makefile"
      - "scripts/setup-foundry/**"
  pull_request:
    paths:
      - ".github/foundry-ci.env"
      - ".github/workflows/setup-foundry.yaml"
      - "Makefile"
      - "scripts/setup-foundry/**"

permissions:
  contents: read
  attestations: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load Foundry settings
        shell: bash
        run: |
          settings=.github/foundry-ci.env
          [ "$(awk 'END { print NR }' "$settings")" -eq 2 ]
          grep -Exq 'FOUNDRY_RELEASE=v[0-9]+\.[0-9]+\.[0-9]+' "$settings"
          grep -Exq 'FOUNDRY_IGNORE_AGE=[01]' "$settings"
          printf '%s\n' "$(cat "$settings")" >> "$GITHUB_ENV"

      - name: Test Setup Foundry
        run: make test-setup-foundry

      - name: Add Foundry to PATH
        run: echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Install Foundry
        run: make install-foundry release="${FOUNDRY_RELEASE}" ignore-age="${FOUNDRY_IGNORE_AGE}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify Foundry
        run: make verify-foundry release="${FOUNDRY_RELEASE}" ignore-age="${FOUNDRY_IGNORE_AGE}"
        env:
          GH_TOKEN: ${{ github.token }}
