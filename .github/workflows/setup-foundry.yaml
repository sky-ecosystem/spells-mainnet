name: Setup Foundry

on:
  push:
    paths:
      - ".github/workflows/setup-foundry.yaml"
      - "Makefile"
      - "scripts/setup-foundry/**"
  pull_request:
    paths:
      - ".github/workflows/setup-foundry.yaml"
      - "Makefile"
      - "scripts/setup-foundry/**"

permissions:
  contents: read
  attestations: read

env:
  FOUNDRY_RELEASE: v1.7.1
  FOUNDRY_IGNORE_AGE: "0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test Setup Foundry
        run: make test-setup-foundry

      - name: Add Foundry to PATH
        run: echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Install Foundry
        run: make install-foundry release="${FOUNDRY_RELEASE}" ignore-age="${FOUNDRY_IGNORE_AGE}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify Foundry
        run: make verify-foundry release="${FOUNDRY_RELEASE}" ignore-age="${FOUNDRY_IGNORE_AGE}"
        env:
          GH_TOKEN: ${{ github.token }}
