name: Setup Foundry

on:
  push:
    paths:
      - "scripts/setup-foundry/**"
  pull_request:
    paths:
      - "scripts/setup-foundry/**"

permissions:
  contents: read
  attestations: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Setup Foundry
        run: make test-setup-foundry

      - name: Add Foundry to PATH
        run: echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Verify or install Foundry
        shell: bash
        run: |
          set +e
          output=$(make verify-foundry 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 3 ]; then
            release=$(printf '%s\n' "$output" | sed -n 's/^Desired Foundry release: //p')
            [[ "$release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Could not determine the desired Foundry release' >&2; exit 1; }
            grep -Fxq "Installation command: make install-foundry release=$release" <<< "$output" || { echo 'Verifier did not report the expected installation command' >&2; exit 1; }
            make install-foundry release="$release"
            make verify-foundry
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
