name: Setup Foundry

on:
  push:
    paths:
      - "scripts/setup-foundry/**"
  pull_request:
    paths:
      - "scripts/setup-foundry/**"

permissions:
  contents: read
  attestations: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Setup Foundry
        run: make test-setup-foundry

      - name: Add Foundry to PATH
        run: echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Verify or install Foundry
        shell: bash
        run: |
          set +e
          output=$(make verify-foundry 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            release=$(printf '%s\n' "$output" | sed -n 's/^Desired Foundry release: //p')
            if [[ "$release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              && grep -Fxq "Installation command: make install-foundry release=$release" <<< "$output"; then
              make install-foundry release="$release"
              make verify-foundry
            else
              exit "$status"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
