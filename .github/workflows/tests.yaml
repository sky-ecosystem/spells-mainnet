name: Tests

on: [push, pull_request]

permissions:
  contents: read
  attestations: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load Foundry settings
        run: |
          settings=.github/foundry-ci.env
          [ "$(wc -l < "$settings")" -eq 2 ]
          grep -Exq 'FOUNDRY_RELEASE=v[0-9]+\.[0-9]+\.[0-9]+' "$settings"
          grep -Exq 'FOUNDRY_IGNORE_AGE=[01]' "$settings"
          cat "$settings" >> "$GITHUB_ENV"

      - name: Add Foundry to PATH
        run: echo "${HOME}/.foundry/bin" >> "${GITHUB_PATH}"

      - name: Install Foundry
        run: make install-foundry release="${FOUNDRY_RELEASE}" ignore-age="${FOUNDRY_IGNORE_AGE}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify Foundry
        run: make verify-foundry release="${FOUNDRY_RELEASE}" ignore-age="${FOUNDRY_IGNORE_AGE}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Forge tests
        run: |
          make test
        id: test
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          AVAX_RPC_URL: ${{ secrets.AVAX_RPC_URL }}
