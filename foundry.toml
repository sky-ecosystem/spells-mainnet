[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
fs_permissions = [
    { access = "read", path = "./lib/dss-test/script/input/"},
    { access = "read", path = "./out/ArbitrumDomain.sol/ArbSysOverride.json"},
    { access = "read", path = "./out-optimized/"}
]
solc_version = "0.8.16"
evm_version  = "cancun"
optimizer = false
optimizer_runs = 200
via_ir = false
libraries = [
    "./lib/dss-exec-lib/src/DssExecLib.sol:DssExecLib:0x8De6DDbCd5053d32292AAA0D2105A32d108484a6"
]

block_gas_limit = 1000000000000000000

# Compile the spell with the optimizer enabled so DssSpellAction fits under the EIP-170 size limit.
# The optimizer-off test suite loads the resulting artifact via vm.deployCode (see _deployNewSpell).
[profile.optimized]
optimizer = true
out = 'out-optimized'

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
unichain = "${UNICHAIN_RPC_URL}"
