[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
fs_permissions = [
    { access = "read", path = "./lib/dss-test/script/input/"},
    { access = "read", path = "./out/ArbitrumDomain.sol/ArbSysOverride.json"}
]
solc_version = "0.8.16"
evm_version  = "osaka"
optimizer = false
optimizer_runs = 200
via_ir = false
libraries = [
    "./lib/dss-exec-lib/src/DssExecLib.sol:DssExecLib:0x99933a7b2982Ea2ad3d7e9027Cd034197aA562C2"
]

block_gas_limit = 1000000000000000000

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
unichain = "${UNICHAIN_RPC_URL}"
